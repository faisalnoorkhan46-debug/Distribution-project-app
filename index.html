}

async function handleRegister(){
  let email = document.getElementById('regEmail').value.trim();
  let password = document.getElementById('regPassword').value.trim();
  if(!email || !password) return alert('Email aur password dono likhein!');
  let btn = document.getElementById('regBtn');
  btn.innerText = 'Registering...';
  btn.disabled = true;

  try {
    let { data, error } = await supa.auth.signUp({ email, password });
    if(error){
      alert('Registration Failed: ' + error.message);
      btn.innerText = 'Register Distribution';
      btn.disabled = false;
    } else {
      if(data.user){
        await supa.from('profiles').insert([{ id: data.user.id, email: email, status: 'pending', role: 'user' }]);
      }
      alert('Account successfully create ho gaya hai! Super Admin approval ke baad aap login kar sakenge.');
      renderLoginModal();
    }
  } catch(e) {
    alert('Error: ' + e.message);
    btn.innerText = 'Register Distribution';
    btn.disabled = false;
  }
}

async function checkUserPermissions(user){
  let { data: profile } = await supa.from('profiles').select('*').eq('id', user.id).single();
  
  if(!profile){
    await supa.from('profiles').insert([{ id: user.id, email: user.email, status: 'pending', role: 'user' }]);
    renderPendingScreen("Aapka account create ho gaya hai. Super Admin ki approval ka intezar karein.");
    return;
  }

  if(profile.status !== 'active'){
    renderPendingScreen("Aapka account abhi 'Pending' status mein hai. Super Admin se active karwayein.");
    return;
  }

  CURRENT_USER_ROLE = profile.role || 'user';
  if(CURRENT_USER_ROLE === 'super_admin'){
    TABS = ADMIN_TABS;
    curTab = 'admin_dash';
  } else {
    TABS = USER_TABS;
    curTab = 'dash';

  renderMainLayout();
  loadAll();
}

function openTab(id){

  if(titleEl) titleEl.innerText=TABS.find(x=>x.id===id)?.label || 'System';
  renderView();

function toggleMobileMenu(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('mobileOverlay');
  if(!sb || !ov) return;
  if(sb.classList.contains('-translate-x-full')){
    sb.classList.remove('-translate-x-full');
    ov.classList.remove('hidden');
  } else {
    sb.classList.add('-translate-x-full');
    ov.classList.add('hidden');
  }
}

async function safeLoad(table){
  try{
    let res;
    if(table==='bills') res = await supa.from('bills').select('*').order('created_at',{ascending:false}).limit(300);
    else if(table==='companies') res = await supa.from('companies').select('*').order('name');
    else if(table==='vendor_ledgers') res = await supa.from('vendor_ledgers').select('*').order('entry_date',{ascending:true});
    else if(table==='customer_ledger') res = await supa.from('customer_ledger').select('*').order('date',{ascending:true});
    else if(table==='banks') res = await supa.from('banks').select('*').order('name');
    else if(table==='customers') res = await supa.from('customers').select('*').order('name');
    else if(table==='purchases') res = await supa.from('purchases').select('*, purchase_items(*)').order('created_at',{ascending:false});
    else if(table==='salesmen') res = await supa.from('salesmen').select('*').order('name');
    else if(table==='profiles') res = await supa.from('profiles').select('*').order('email');
    else if(table==='audit_logs') res = await supa.from('audit_logs').select('*').order('created_at', {ascending:false}).limit(50);
    else res = await supa.from('items').select('*').order('name');
    if(res.error){console.warn(table,res.error.message); return [];}
    return res.data||[];
  }catch(e){return [];}
}

async function loadAll(){
  let vArea = document.getElementById('viewArea');
  if(vArea && !DATA.customers.length) vArea.innerHTML='<div class="card p-8 text-center">Connecting to Supabase...</div>';
  DATA.customers = await safeLoad('customers');
  DATA.items = await safeLoad('items');
  DATA.bills = await safeLoad('bills');
  DATA.companies = await safeLoad('companies');
  DATA.ledgers = await safeLoad('vendor_ledgers');
  DATA.cust_ledgers = await safeLoad('customer_ledger');
  DATA.banks = await safeLoad('banks');
  DATA.purchases = await safeLoad('purchases');
  DATA.salesmen = await safeLoad('salesmen');
  DATA.all_users = await safeLoad('profiles');
  DATA.audit_logs = await safeLoad('audit_logs');
  renderView();
}

function getBal(cid){
  let c=DATA.companies.find(x=>x.id===cid);
  let bal=Number(c?.opening_balance||0);
  DATA.ledgers.filter(l=>l.company_id===cid).forEach(e=>{
    if(e.type==='purchase') bal+=Number(e.debit||0);
    else bal-=Number(e.credit||0);
  });
  return bal;
}

function getCustBal(cid){
  let bal = 0;
  DATA.cust_ledgers.filter(l => String(l.customer_id) === String(cid)).forEach(e => {
    bal += Number(e.debit || 0) - Number(e.credit || 0);
  });
  return bal;
}

function calculateSaleTotals(){
  let subTotal = SALE_ITEMS.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);
  if(document.getElementById('lblGrandTotal')) document.getElementById('lblGrandTotal').innerText = 'Rs ' + Math.round(subTotal).toLocaleString();
  return { grandTotal: subTotal };
}

function onSaleItemChange(){
  let itemId = document.getElementById('saleItem')?.value;
  let it = DATA.items.find(x => String(x.id) === String(itemId));
  if(it && document.getElementById('salePrice')) document.getElementById('salePrice').value = it.sale_price || 0;
}

function addItemToSale(){
  let itemId = document.getElementById('saleItem')?.value;
  let price = Number(document.getElementById('salePrice')?.value || 0);
  let qty = Number(document.getElementById('saleQty')?.value || 1);
  let it = DATA.items.find(x => String(x.id) === String(itemId));
  if(!it) return alert('Select item!');
  SALE_ITEMS.push({ id: it.id, name: it.name, price: price, qty: qty });
  renderView();
}

function removeSaleItem(idx){
  SALE_ITEMS.splice(idx, 1);
  renderView();
}

async function saveFinalBill(){
  let salesmanId = document.getElementById('saleSalesman')?.value;
  let custId = document.getElementById('saleCust')?.value;
  if(!salesmanId || !custId) return alert('Select salesman and customer!');
  if(SALE_ITEMS.length === 0) return alert('Add items!');
  let grandTotal = SALE_ITEMS.reduce((s,i)=>s+(i.price*i.qty),0);
  let invNo = 'INV-' + Math.floor(1000 + Math.random() * 9000);
  await supa.from('bills').insert([{ customer_id: custId, salesman_id: salesmanId, invoice_no: invNo, total_amount: grandTotal, bill_type: 'simple', items: JSON.stringify(SALE_ITEMS) }]);
  await supa.from('audit_logs').insert([{ action: 'CREATE_SALE', entity: 'Invoice', user_email: 'FAISAL', ip: '10.31.55.151' }]);
  alert('Order saved successfully! Invoice: ' + invNo);
  SALE_ITEMS = [];
  loadAll();
}

  let it = DATA.items.find(x => String(x.id) === String(itemId));
  if(it && document.getElementById('purchaseRate')) document.getElementById('purchaseRate').value = it.sale_price || 0;
}

function addItemToPurchase(){
  let itemId = document.getElementById('purchaseItem')?.value;
  let rate = Number(document.getElementById('purchaseRate')?.value || 0);
  let qty = Number(document.getElementById('purchaseQty')?.value || 1);
  let it = DATA.items.find(x => String(x.id) === String(itemId));
  if(!it) return alert('Select item!');
  PURCHASE_ITEMS.push({ id: it.id, name: it.name, rate: rate, qty: qty });
  renderView();
}

function removePurchaseItem(idx){
  PURCHASE_ITEMS.splice(idx, 1);
  renderView();
}

async function saveFinalPurchase(){
  let vendorId = document.getElementById('purchaseVendor')?.value;
  let pDate = document.getElementById('purchaseDate')?.value;
  if(!vendorId) return alert('Select vendor!');
  if(PURCHASE_ITEMS.length === 0) return alert('Add items!');
  let grandTotal = PURCHASE_ITEMS.reduce((s,i)=>s+(i.rate*i.qty),0);
  let billNo = 'PUR-' + Math.floor(1000 + Math.random() * 9000);
  let { data } = await supa.from('purchases').insert([{ vendor_id: vendorId, bill_no: billNo, total_amount: grandTotal, purchase_date: pDate }]).select();
  let pId = data && data.length ? data[0].id : null;
  for(let pi of PURCHASE_ITEMS){
    if(pId) await supa.from('purchase_items').insert([{ purchase_id: pId, item_id: pi.id, quantity: pi.qty, rate: pi.rate, total: pi.rate * pi.qty }]);
  }
  alert('Purchase saved successfully!');
  PURCHASE_ITEMS = [];
  loadAll();
}

function printInvoice(id){
  let b = DATA.bills.find(x => String(x.id) === String(id));
  if(!b) return;
  let w = window.open('','_blank','width=600,height=600');
  w.document.write('<h3>Invoice: '+b.invoice_no+'</h3><p>Total: Rs '+b.total_amount+'</p><script>window.print();<\/script>');
  w.document.close();
}
