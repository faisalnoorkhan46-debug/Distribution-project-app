function renderSide(){
  document.getElementById('sideNav').innerHTML = TABS.map(t => 
    '<button onclick="openTab(\'' + t.id + '\')" class="w-full text-left px-3.5 py-3 rounded-xl flex gap-3 text-[14px] ' + (curTab===t.id ? 'bg-slate-900 text-white shadow' : 'hover:bg-slate-100') + '"><span>' + t.icon + '</span>' + t.label + '</button>'
  ).join('');
}

function openTab(id){
  curTab=id;
  renderSide();
  document.getElementById('pageTitle').innerText=TABS.find(x=>x.id===id)?.label || 'System';
  if(id!=='ledger' && id!=='cust_ledger'){ CUR_COMPANY=null; CUR_CUSTOMER=null; }
  renderView();
  if(window.innerWidth<768) toggleMobileMenu();
}

function toggleMobileMenu(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('mobileOverlay');
  if(sb.classList.contains('-translate-x-full')){
    sb.classList.remove('-translate-x-full');
    ov.classList.remove('hidden');
  } else {
    sb.classList.add('-translate-x-full');
    ov.classList.add('hidden');
  }
}

async function safeLoad(table){
  try{
    let res;
    if(table==='bills') res = await supa.from('bills').select('*, customers(name, area)').order('created_at',{ascending:false}).limit(300);
    else if(table==='companies') res = await supa.from('companies').select('*').order('name');
    else if(table==='vendor_ledgers') res = await supa.from('vendor_ledgers').select('*').order('entry_date',{ascending:true});
    else if(table==='customer_ledger') res = await supa.from('customer_ledger').select('*').order('date',{ascending:true});
    else if(table==='banks') res = await supa.from('banks').select('*').order('name');
    else if(table==='customers') res = await supa.from('customers').select('*').order('name');
    else res = await supa.from('items').select('*').order('name');
    if(res.error){console.warn(table,res.error.message); return [];}
    return res.data||[];
  }catch(e){return [];}
}

async function loadAll(){
  document.getElementById('viewArea').innerHTML='<div class="card p-8 text-center">Connecting to Supabase...</div>';
  DATA.customers = await safeLoad('customers');
  DATA.items = await safeLoad('items');
  DATA.bills = await safeLoad('bills');
  DATA.companies = await safeLoad('companies');
  DATA.ledgers = await safeLoad('vendor_ledgers');
  DATA.cust_ledgers = await safeLoad('customer_ledger');
  DATA.banks = await safeLoad('banks');
  renderView();
}

function getBal(cid){
  let c=DATA.companies.find(x=>x.id===cid);
  let bal=Number(c?.opening_balance||0);
  DATA.ledgers.filter(l=>l.company_id===cid).forEach(e=>{
    if(e.type==='purchase') bal+=Number(e.debit||0);
    else bal-=Number(e.credit||0);
  });
  return bal;
}

function getCustBal(cid){
  let bal = 0;
  DATA.cust_ledgers.filter(l => String(l.customer_id) === String(cid)).forEach(e => {
    bal += Number(e.debit || 0) - Number(e.credit || 0);
  });
  return bal;
}

function onSaleCustChange(){
  let custEl = document.getElementById('saleCust');
  let typeEl = document.getElementById('saleBillType');
  let gstEl = document.getElementById('gstRate');
  let addEl = document.getElementById('addTaxRate');
  let nonEl = document.getElementById('nonRegTaxRate');
  if(!custEl) return;
  let custId = custEl.value;
  let c = DATA.customers.find(x => String(x.id) === String(custId));
  if(c){
    if(typeEl) typeEl.value = c.default_bill_type || 'simple';
    if(gstEl) gstEl.value = c.gst_rate !== undefined ? c.gst_rate : 18;
    if(addEl) addEl.value = c.add_tax_rate !== undefined ? c.add_tax_rate : 3;
    if(nonEl) nonEl.value = c.non_reg_tax_rate !== undefined ? c.non_reg_tax_rate : 0.25;
  }
  calculateSaleTotals();
}

function toggleClMode(sel){
  let bankEl = document.getElementById('clBank');
  if(bankEl) bankEl.style.display = sel.value === 'payment' ? 'block' : 'none';
}

function openCustLedger(id){
  CUR_CUSTOMER = id;
  curTab = 'cust_ledger';
  document.getElementById('pageTitle').innerText = 'Customer Ledger';
  renderView();
}

async function addCustLed(){
  let amt = Number(document.getElementById('clAmt').value || 0);
  if(!amt) return alert('Amount darj karein!');
  let type = document.getElementById('clType').value;
  let bankId = document.getElementById('clBank').value || null;
  let payload = {
    customer_id: CUR_CUSTOMER,
    date: document.getElementById('clDate').value,
    type: type,
    bank_id: type === 'payment' ? bankId : null,
    bill_no: document.getElementById('clBill').value,
    description: document.getElementById('clDesc').value,
    debit: type === 'sale' ? amt : 0,
    credit: type === 'payment' ? amt : 0
  };
  let { error } = await supa.from('customer_ledger').insert([payload]);
  if(error){ alert(error.message); return; }
  await loadAll();
  openCustLedger(CUR_CUSTOMER);
}

async function saveBank(){
  let name = document.getElementById('bName').value.trim();
  if(!name) return alert('Bank/Wallet name likhein!');
  let payload = { name: name, account_no: document.getElementById('bAcc').value };
  if(EDIT_BANK_ID){
    let { error } = await supa.from('banks').update(payload).eq('id', EDIT_BANK_ID);
    if(error){ alert(error.message); return; }
    cancelBank(); loadAll(); return;
  }
  let { error } = await supa.from('banks').insert([payload]);
  if(error){ alert(error.message); return; }
  cancelBank(); loadAll();
}

function editBank(id){
  let b = DATA.banks.find(x => String(x.id) === String(id));
  EDIT_BANK_ID = id;
  document.getElementById('bName').value = b.name || '';
  document.getElementById('bAcc').value = b.account_no || '';
  document.getElementById('bankTitle').innerText = 'Edit Bank Account';
  document.getElementById('bankBtn').innerText = 'Update Bank';
  document.getElementById('bankCancel').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelBank(){
  EDIT_BANK_ID = null;
  ['bName', 'bAcc'].forEach(i => { if(document.getElementById(i)) document.getElementById(i).value = ''; });
  document.getElementById('bankTitle').innerText = 'Add Bank / Wallet Account';
  document.getElementById('bankBtn').innerText = 'Save Bank';
  document.getElementById('bankCancel').classList.add('hidden');
}

async function delBank(id){
  if(!confirm('Delete bank?')) return;
  await supa.from('banks').delete().eq('id', id);
  loadAll();
}

function printInvoice(id) {
  let b = DATA.bills.find(x => String(x.id) === String(id));
  if(!b) return alert('Bill nahi mila!');
  let items = [];
  try { items = typeof b.items === 'string' ? JSON.parse(b.items) : (b.items || []); } catch(e) { items = []; }
  let cName = b.customers?.name || 'Walk-in Customer';
  let cArea = b.customers?.area || '-';
  let printWindow = window.open('', '_blank', 'width=800,height=600');
  printWindow.document.write('<html><head><title>Invoice - ' + b.invoice_no + '</title><style>body{font-family:Arial,sans-serif;padding:20px;color:#333}.header{text-align:center;margin-bottom:20px}.invoice-info{display:flex;justify-content:space-between;margin-bottom:20px;font-size:14px}table{width:100%;border-collapse:collapse;margin-bottom:20px}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px}th{background-color:#f2f2f2}.total{text-align:right;font-size:16px;font-weight:bold}</style></head><body><div class="header"><h2>QNH ENTERPRISES</h2><p>Distribution System - Invoice</p></div><div class="invoice-info"><div><p><b>Invoice No:</b> ' + b.invoice_no + '</p><p><b>Customer:</b> ' + cName + ' (' + cArea + ')</p></div><div><p><b>Date:</b> ' + new Date(b.created_at).toLocaleDateString() + '</p><p><b>Type:</b> ' + (b.bill_type || 'simple').toUpperCase() + '</p></div></div><table><thead><tr><th>Item Name</th><th>Price</th><th>Qty</th><th>Total</th></tr></thead><tbody>' + items.map(i => '<tr><td>' + i.name + '</td><td>Rs ' + i.price + '</td><td>' + i.qty + '</td><td>Rs ' + (i.price * i.qty) + '</td></tr>').join('') + '</tbody></table><div class="total">Grand Total: Rs ' + Number(b.total_amount || 0).toLocaleString() + '</div><script>window.onload=function(){window.print();}<\/script></body></html>');
  printWindow.document.close();
}

function toggleSelectAllInvoices(master) {
  let checkboxes = document.querySelectorAll('.inv-checkbox');
  checkboxes.forEach(cb => cb.checked = master.checked);
}

  selectedBills.forEach(b => {
    let items = [];
    try { items = typeof b.items === 'string' ? JSON.parse(b.items) : (b.items || []); } catch(e){}

  });

async function saveFinalPurchase(){
  let vendorId = document.getElementById('purchaseVendor').value;
  let purchaseDate = document.getElementById('purchaseDate').value;
  if(!vendorId) return alert('Pehle Vendor select karein!');
  if(PURCHASE_ITEMS.length === 0) return alert('Bill mein kam se kam 1 item add karein!');
  let grandTotal = PURCHASE_ITEMS.reduce((sum, item) => sum + (Number(item.rate) * Number(item.qty)), 0);
  let billNo = 'PUR-' + Math.floor(1000 + Math.random() * 9000);
  let { data: pData, error: pErr } = await supa.from('purchases').insert([{ vendor_id: vendorId, bill_no: billNo, total_amount: grandTotal, purchase_date: purchaseDate }]).select();
  if(pErr){ alert('Purchase save karne mein error: ' + pErr.message); return; }
  let purchaseId = pData && pData.length > 0 ? pData[0].id : null;
  for(let item of PURCHASE_ITEMS){
    if(purchaseId){
      await supa.from('purchase_items').insert([{ purchase_id: purchaseId, item_id: item.id, quantity: item.qty, rate: item.rate, total: item.rate * item.qty }]);
    }
    let currentIt = DATA.items.find(x => String(x.id) === String(item.id));
    let newStock = Number(currentIt?.current_stock || 0) + Number(item.qty);
    await supa.from('items').update({ current_stock: newStock }).eq('id', item.id);
  }
  let { error: lErr } = await supa.from('vendor_ledgers').insert([{ company_id: vendorId, entry_date: purchaseDate, type: 'purchase', bill_no: billNo, description: 'Purchase Bill Items Total: Rs ' + grandTotal, debit: grandTotal, credit: 0 }]);
  if(lErr) console.warn('Ledger entry error:', lErr.message);
  alert('Purchase Bill successfully save ho gaya!');
  PURCHASE_ITEMS = [];
  await loadAll();
  openTab('purchase');
}

function calculateSaleTotals(){
  let subTotal = SALE_ITEMS.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);
  let billTypeEl = document.getElementById('saleBillType');
  let custEl = document.getElementById('saleCust');
  if(!billTypeEl || !custEl) return;
  let billType = billTypeEl.value;
  let custId = custEl.value;
  let selectedCust = DATA.customers.find(c => String(c.id) === String(custId));
  let gstAmount = 0, addTaxAmount = 0, nonRegTaxAmount = 0;
  let isReg = selectedCust ? (selectedCust.is_registered === true || String(selectedCust.is_registered) === 'true') : true;
  let gstRate = Number(document.getElementById('gstRate')?.value || 18);
  let addTaxRate = Number(document.getElementById('addTaxRate')?.value || 3);
  let nonRegTaxRate = Number(document.getElementById('nonRegTaxRate')?.value || 0.25);
  if (billType === 'tax') {
    gstAmount = (subTotal * gstRate) / 100;
    addTaxAmount = (subTotal * addTaxRate) / 100;
    if (selectedCust && !isReg) nonRegTaxAmount = (subTotal * nonRegTaxRate) / 100;
    if(document.getElementById('rowGst')) document.getElementById('rowGst').style.display = 'flex';
    if(document.getElementById('rowAddTax')) document.getElementById('rowAddTax').style.display = 'flex';
    if(document.getElementById('rowNonReg')) document.getElementById('rowNonReg').style.display = !isReg ? 'flex' : 'none';
  } else {
    if(document.getElementById('rowGst')) document.getElementById('rowGst').style.display = 'none';
    if(document.getElementById('rowAddTax')) document.getElementById('rowAddTax').style.display = 'none';
    if(document.getElementById('rowNonReg')) document.getElementById('rowNonReg').style.display = 'none';
  }
  let grandTotal = subTotal + gstAmount + addTaxAmount + nonRegTaxAmount;
  if(document.getElementById('lblSubTotal')) document.getElementById('lblSubTotal').innerText = 'Rs ' + Math.round(subTotal).toLocaleString();
  if(document.getElementById('lblGst')) document.getElementById('lblGst').innerText = 'Rs ' + Math.round(gstAmount).toLocaleString();
  if(document.getElementById('lblAddTax')) document.getElementById('lblAddTax').innerText = 'Rs ' + Math.round(addTaxAmount).toLocaleString();
  if(document.getElementById('lblNonRegTax')) document.getElementById('lblNonRegTax').innerText = 'Rs ' + Math.round(nonRegTaxAmount).toLocaleString();
  if(document.getElementById('lblGrandTotal')) document.getElementById('lblGrandTotal').innerText = 'Rs ' + Math.round(grandTotal).toLocaleString();
  return { subTotal, gstAmount, addTaxAmount, nonRegTaxAmount, grandTotal, billType, custId };
}

async function getNextInvoiceNumber(billType) {
  let prefix = (billType === 'tax') ? 'TAX-' : 'INV-';
  try {
    let { data } = await supa.from('bills').select('invoice_no').ilike('invoice_no', prefix + '%').order('created_at', { ascending: false }).limit(1);
    if (!data || data.length === 0) return prefix + '1001';
    let lastNum = parseInt(data[0].invoice_no.replace(prefix, '')) || 1000;
    return prefix + (lastNum + 1);
  } catch(e) {
    return prefix + (Math.floor(Math.random() * 9000) + 1000);
  }
}

function editBill(id){
  let b = DATA.bills.find(x => String(x.id) === String(id));
  if(!b) return alert('Bill nahi mila!');

    try {
      SALE_ITEMS = typeof b.items === 'string' ? JSON.parse(b.items) : b.items;

    } catch(e) { SALE_ITEMS = []; }
  } else { SALE_ITEMS = []; }
  openTab('sale');
  setTimeout(() => {

    let tEl = document.getElementById('saleBillType');
    if(cEl && b.customer_id) cEl.value = String(b.customer_id);
    if(tEl && b.bill_type) tEl.value = String(b.bill_type);

  }, 150);
}

async function saveFinalBill(){
  let totals = calculateSaleTotals();
  if(!totals) return;
  if(!totals.custId) return alert('Pehle Customer select karein!');
  if(SALE_ITEMS.length === 0) return alert('Bill mein kam se kam 1 item add karein!');
  let invNo;
  if(EDIT_BILL_ID) {
    let existingBill = DATA.bills.find(b => String(b.id) === String(EDIT_BILL_ID));
    invNo = existingBill ? existingBill.invoice_no : await getNextInvoiceNumber(totals.billType);
  } else {
    invNo = await getNextInvoiceNumber(totals.billType);
  }
  let payload = { customer_id: totals.custId, invoice_no: invNo, total_amount: totals.grandTotal, bill_type: totals.billType, items: JSON.stringify(SALE_ITEMS) };
  let res;
  if(EDIT_BILL_ID) {
    res = await supa.from('bills').update(payload).eq('id', EDIT_BILL_ID);
  } else {
    res = await supa.from('bills').insert([payload]);
  }
  if(res.error){
    delete payload.items;
    let fallback = EDIT_BILL_ID ? await supa.from('bills').update(payload).eq('id', EDIT_BILL_ID) : await supa.from('bills').insert([payload]);
    if(fallback.error){ alert('Bill save karne mein error: ' + fallback.error.message); return; }
  }

  await supa.from('customer_ledger').insert([{
    customer_id: totals.custId,
    date: new Date().toISOString().split('T')[0],
    type: 'sale',
    bill_no: invNo,
    description: 'Sale Bill Total: Rs ' + totals.grandTotal,
    debit: totals.grandTotal,
    credit: 0
  }]);

  alert((EDIT_BILL_ID ? 'Bill Update' : 'Bill Save') + ' ho gaya hai! Invoice Number: ' + invNo);
  SALE_ITEMS = [];
  EDIT_BILL_ID = null;
  await loadAll();
  openTab('history');
}
